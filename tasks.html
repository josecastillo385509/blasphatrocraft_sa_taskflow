<!DOCTYPE html>
<html lang="es" data-theme="light" data-page="tasks">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas — TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app" id="app">
  <main class="main">
    <div id="topbar-mount"></div>
    <div class="content">
      <div class="toolbar">
        <select class="field-select" id="filter-project">
          <option value="all">Todos los proyectos</option>
        </select>
        <select class="field-select" id="filter-status">
          <option value="all">Todos los estados</option>
          <option value="pendiente">Pendiente</option>
          <option value="en-progreso">En progreso</option>
          <option value="terminado">Terminado</option>
        </select>
        <select class="field-select" id="filter-priority">
          <option value="all">Todas las prioridades</option>
          <option value="alta">Alta</option>
          <option value="media">Media</option>
          <option value="baja">Baja</option>
        </select>
        <input type="text" class="field-input" id="filter-search" placeholder="Buscar tarea..." style="flex:1; min-width:180px;">
        <button class="btn btn-accent" id="btn-new-task">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
          Nueva tarea
        </button>
      </div>
      <div id="tasks-container"></div>
    </div>
  </main>
</div>

<!-- Modal Tarea -->
<div class="modal-overlay" id="modal-task">
  <div class="modal">
    <div class="modal-head">
      <h3 class="modal-title" id="modal-task-title">Nueva <em>tarea</em></h3>
      <button class="icon-btn-sm" data-close-modal>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field" data-field="task-title">
        <label class="field-label">Título <span class="req">*</span></label>
        <input class="field-input" id="task-title" maxlength="120" placeholder="Ej: Diseñar página de inicio">
        <div class="field-error">El título es obligatorio.</div>
      </div>
      <div class="field">
        <label class="field-label">Descripción</label>
        <textarea class="field-textarea" id="task-desc" maxlength="500" placeholder="Detalles adicionales..."></textarea>
      </div>
      <div class="field" data-field="task-project">
        <label class="field-label">Proyecto <span class="req">*</span></label>
        <select class="field-select" id="task-project"></select>
        <div class="field-error">Selecciona un proyecto.</div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Prioridad</label>
          <select class="field-select" id="task-priority">
            <option value="alta">Alta</option>
            <option value="media" selected>Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">Estado</label>
          <select class="field-select" id="task-status">
            <option value="pendiente" selected>Pendiente</option>
            <option value="en-progreso">En progreso</option>
            <option value="terminado">Terminado</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field" data-field="task-due">
          <label class="field-label">Fecha límite</label>
          <input class="field-input" type="date" id="task-due">
          <div class="field-error">Fecha inválida.</div>
        </div>
        <div class="field">
          <label class="field-label">Asignar a</label>
          <select class="field-select" id="task-assignee">
            <option value="">— Sin asignar —</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="task-delete" style="margin-right:auto; display:none;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        Eliminar
      </button>
      <button class="btn btn-ghost" data-close-modal>Cancelar</button>
      <button class="btn btn-accent" id="task-save">Guardar</button>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/tasks.js"></script>
</body>
</html>
