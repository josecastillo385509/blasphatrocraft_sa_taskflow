<!DOCTYPE html>
<html lang="es" data-theme="light" data-page="calendar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario — TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app" id="app">
  <main class="main">
    <div id="topbar-mount"></div>
    <div class="content">
      <div class="cal-toolbar">
        <h2 class="cal-month" id="cal-month-label">—</h2>
        <div class="cal-nav">
          <button class="btn btn-ghost btn-sm" id="cal-today">Hoy</button>
          <button class="icon-btn" id="cal-prev"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="icon-btn" id="cal-next"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </div>
      <div class="calendar">
        <div class="cal-weekdays">
          <div class="cal-weekday">Lun</div>
          <div class="cal-weekday">Mar</div>
          <div class="cal-weekday">Mié</div>
          <div class="cal-weekday">Jue</div>
          <div class="cal-weekday">Vie</div>
          <div class="cal-weekday">Sáb</div>
          <div class="cal-weekday">Dom</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
