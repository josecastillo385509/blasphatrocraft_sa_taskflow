<!DOCTYPE html>
<html lang="es" data-theme="light" data-page="dashboard">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio — TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app" id="app">
  <!-- Sidebar inyectado por ui.js -->
  <main class="main">
    <div id="topbar-mount"></div>
    <div class="content">
      <div class="stat-grid" id="stat-grid"></div>
      <div class="dashboard-grid">
        <div class="card">
          <div class="section-title">
            Actividad <em>reciente</em>
            <span style="font-family:var(--font-mono); font-size:11px; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.1em;">últimos 10</span>
          </div>
          <ul class="activity-list" id="activity-list"></ul>
        </div>
        <div class="card">
          <div class="section-title">Hoy</div>
          <div id="today-tasks"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
