<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Dashboard</title>
  <link rel="stylesheet" href="taskflow.css">
  <style>
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: border-color var(--transition), transform var(--transition);
      cursor: default;
    }
    .stat-card:hover { border-color: var(--border-light); transform: translateY(-2px); }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }
    .stat-card.accent::before { background: var(--accent); }
    .stat-card.green::before { background: var(--green); }
    .stat-card.blue::before { background: var(--blue); }
    .stat-card.red::before { background: var(--red); }
    .stat-icon {
      font-size: 1.6rem;
      margin-bottom: 12px;
      display: block;
    }
    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
      letter-spacing: -1px;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .stat-sub {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      align-items: start;
    }

    .project-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition);
      border-radius: var(--radius-sm);
    }
    .project-item:last-child { border-bottom: none; }
    .project-item:hover .project-name { color: var(--accent); }

    .proj-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .project-info { flex: 1; min-width: 0; }
    .project-name { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
    .project-meta { display: flex; align-items: center; gap: 10px; }
    .project-pct {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--accent);
      flex-shrink: 0;
    }

    .activity-item {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 6px;
      flex-shrink: 0;
    }
    .activity-dot.task { background: var(--blue); }
    .activity-dot.project { background: var(--green); }
    .activity-msg { font-size: 0.82rem; color: var(--text-secondary); flex: 1; }
    .activity-time { font-size: 0.72rem; font-family: var(--font-mono); color: var(--text-muted); margin-top: 2px; }

    .task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      background: var(--bg-2);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
    }
    .task-row:hover { border-color: var(--border-light); background: var(--bg-3); }
    .task-row-title { font-size: 0.85rem; font-weight: 500; flex: 1; color: var(--text-primary); }
    .task-check {
      width: 16px; height: 16px;
      border: 2px solid var(--border-light);
      border-radius: 4px;
      flex-shrink: 0;
      cursor: pointer;
      transition: all var(--transition);
      background: none;
      display: flex; align-items: center; justify-content: center;
    }
    .task-check.done { background: var(--green); border-color: var(--green); color: #000; font-size: 0.6rem; }

    .donut-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px auto;
    }
    .donut-center {
      position: absolute;
      text-align: center;
    }
    .donut-pct { font-size: 1.6rem; font-weight: 800; }
    .donut-sublabel { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .legend-val { margin-left: auto; font-family: var(--font-mono); font-weight: 600; color: var(--text-primary); }

    .quick-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .bar-label { font-size: 0.78rem; color: var(--text-secondary); width: 90px; flex-shrink: 0; }
    .bar-track { flex: 1; height: 6px; background: var(--bg-3); border-radius: 100px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 100px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
    .bar-val { font-size: 0.72rem; font-family: var(--font-mono); color: var(--text-muted); width: 24px; text-align: right; flex-shrink: 0; }

    @media (max-width: 900px) {
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .dashboard-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      .stat-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="navWrap"></div>

  <main class="main">
    <div class="container">
      <!-- Header -->
      <div class="page-header">
        <div>
          <h1 class="page-title">Dashboard <span>&</span> Stats</h1>
          <p class="page-subtitle" id="dateLabel"></p>
        </div>
        <div class="flex gap-8">
          <button class="btn btn-secondary btn-sm" id="exportBtn">↑ Exportar</button>
          <label class="btn btn-secondary btn-sm" style="cursor:pointer">↓ Importar<input type="file" id="importInput" accept=".json" class="hidden"></label>
          <button class="btn btn-danger btn-sm" id="clearBtn">⊗ Limpiar</button>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions">
        <a href="projects.html" class="btn btn-primary">+ Nuevo Proyecto</a>
        <a href="tasks.html" class="btn btn-secondary">+ Nueva Tarea</a>
        <a href="kanban.html" class="btn btn-secondary">▦ Ver Kanban</a>
        <a href="calendar.html" class="btn btn-secondary">◫ Calendario</a>
      </div>

      <!-- Stats row -->
      <div class="stat-grid" id="statGrid"></div>

      <!-- Main Grid -->
      <div class="dashboard-grid">
        <!-- Left column -->
        <div>
          <!-- Active Tasks -->
          <div class="card mb-16">
            <div class="card-header">
              <span class="section-title">Tareas Recientes</span>
              <a href="tasks.html" class="btn btn-ghost btn-sm">Ver todas →</a>
            </div>
            <div id="tasksList"></div>
          </div>

          <!-- Projects Progress -->
          <div class="card mb-16">
            <div class="card-header">
              <span class="section-title">Proyectos</span>
              <a href="projects.html" class="btn btn-ghost btn-sm">Gestionar →</a>
            </div>
            <div id="projectsList"></div>
          </div>

          <!-- Stats by Priority -->
          <div class="card">
            <div class="card-header">
              <span class="section-title">Distribución por Prioridad</span>
            </div>
            <div id="priorityBars"></div>
          </div>
        </div>

        <!-- Right column -->
        <div>
          <!-- Donut chart -->
          <div class="card mb-16">
            <div class="card-header">
              <span class="section-title">Estado de Tareas</span>
            </div>
            <div class="donut-wrap" id="donutWrap">
              <svg width="160" height="160" id="donutSvg"></svg>
              <div class="donut-center">
                <div class="donut-pct" id="donutPct">0%</div>
                <div class="donut-sublabel">completadas</div>
              </div>
            </div>
            <div id="donutLegend"></div>
          </div>

          <!-- Activity feed -->
          <div class="card">
            <div class="card-header">
              <span class="section-title">Actividad Reciente</span>
            </div>
            <div id="activityFeed"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="taskflow.js"></script>
  <script>
    // ── Date ─────────────────────────────────────────────────────────────────
    document.getElementById('dateLabel').textContent =
      new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    // ── Render Stats ─────────────────────────────────────────────────────────
    function renderStats() {
      const s = TF.getStats();
      const cards = [
        { icon: '◈', value: s.totalProjects, label: 'Proyectos', sub: `${s.totalTasks} tareas totales`, cls: 'accent' },
        { icon: '◉', value: s.pending, label: 'Pendientes', sub: `${s.highPriority} alta prioridad`, cls: 'blue' },
        { icon: '▶', value: s.progress, label: 'En Progreso', sub: `${s.done} completadas`, cls: 'accent' },
        { icon: '⚠', value: s.overdue, label: 'Vencidas', sub: `de ${s.totalTasks} tareas`, cls: 'red' },
      ];
      document.getElementById('statGrid').innerHTML = cards.map(c => `
        <div class="stat-card ${c.cls} fade-in">
          <span class="stat-icon">${c.icon}</span>
          <div class="stat-value">${c.value}</div>
          <div class="stat-label">${c.label}</div>
          <div class="stat-sub">${c.sub}</div>
        </div>
      `).join('');
    }

    // ── Render Donut ─────────────────────────────────────────────────────────
    function renderDonut() {
      const s = TF.getStats();
      const total = s.totalTasks;
      const segments = [
        { val: s.done, color: '#3ecf8e', label: 'Completadas' },
        { val: s.progress, color: '#5b8af0', label: 'En Progreso' },
        { val: s.pending, color: '#2e3340', label: 'Pendientes' },
      ];
      const pct = total ? Math.round((s.done / total) * 100) : 0;
      document.getElementById('donutPct').textContent = pct + '%';

      const svg = document.getElementById('donutSvg');
      const cx = 80, cy = 80, r = 60, stroke = 24;
      const circumference = 2 * Math.PI * r;
      let offset = -circumference * 0.25;
      let paths = '';

      segments.forEach(seg => {
        const frac = total ? seg.val / total : 0;
        const dash = frac * circumference;
        paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}"
          stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}"
          style="transition: stroke-dasharray 0.6s ease"/>`;
        offset += dash;
      });

      svg.innerHTML = paths + `<circle cx="${cx}" cy="${cy}" r="${r - stroke/2 - 2}" fill="var(--bg-1)"/>`;

      document.getElementById('donutLegend').innerHTML = segments.map(s => `
        <div class="legend-item">
          <span class="legend-dot" style="background:${s.color}"></span>
          <span>${s.label}</span>
          <span class="legend-val">${total ? Math.round((segments.find(x=>x.label===s.label).val/total)*100) : 0}%</span>
        </div>
      `).join('');
    }

    // ── Render Projects ───────────────────────────────────────────────────────
    function renderProjects() {
      const projects = TF.getProjects();
      const el = document.getElementById('projectsList');
      if (!projects.length) {
        el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◈</div><h3>Sin proyectos</h3><p><a href="projects.html" style="color:var(--accent)">Crear un proyecto</a></p></div>`;
        return;
      }
      el.innerHTML = projects.slice(0, 6).map(p => {
        const pct = TF.getProjectProgress(p.id);
        const tasks = TF.getTasksByProject(p.id);
        return `
          <div class="project-item" onclick="location.href='tasks.html?project=${p.id}'">
            <span class="proj-dot" style="background:${p.color}"></span>
            <div class="project-info">
              <div class="project-name">${p.name}</div>
              <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${p.color}"></div></div>
              <div class="project-meta" style="margin-top:4px">
                <span class="text-muted" style="font-size:0.72rem;font-family:var(--font-mono)">${tasks.length} tarea${tasks.length !== 1 ? 's' : ''}</span>
              </div>
            </div>
            <span class="project-pct">${pct}%</span>
          </div>`;
      }).join('');
    }

    // ── Render Tasks ─────────────────────────────────────────────────────────
    function renderTasks() {
      const tasks = TF.getTasks().slice(-8).reverse();
      const el = document.getElementById('tasksList');
      if (!tasks.length) {
        el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◉</div><h3>Sin tareas</h3><p><a href="tasks.html" style="color:var(--accent)">Crear una tarea</a></p></div>`;
        return;
      }
      el.innerHTML = tasks.map(t => {
        const done = t.status === 'done';
        const overdue = TF.isOverdue(t);
        return `
          <div class="task-row" onclick="location.href='tasks.html'">
            <div class="task-check ${done ? 'done' : ''}" onclick="toggleTask(event,'${t.id}')">${done ? '✓' : ''}</div>
            <span class="task-row-title" style="${done ? 'text-decoration:line-through;color:var(--text-muted)' : ''}">${t.title}</span>
            <span class="badge ${TF.priorityClass[t.priority]}">${TF.priorityLabel[t.priority]}</span>
            ${overdue ? '<span style="font-size:0.72rem;color:var(--red)">⚠ Vencida</span>' : ''}
          </div>`;
      }).join('');
    }

    // ── Render Priority Bars ─────────────────────────────────────────────────
    function renderPriorityBars() {
      const tasks = TF.getTasks();
      const total = tasks.length || 1;
      const high = tasks.filter(t => t.priority === 'high').length;
      const medium = tasks.filter(t => t.priority === 'medium').length;
      const low = tasks.filter(t => t.priority === 'low').length;
      const bars = [
        { label: 'Alta', val: high, color: 'var(--red)' },
        { label: 'Media', val: medium, color: 'var(--accent)' },
        { label: 'Baja', val: low, color: 'var(--green)' },
      ];
      document.getElementById('priorityBars').innerHTML = bars.map(b => `
        <div class="bar-row">
          <span class="bar-label">${b.label}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(b.val/total*100)}%;background:${b.color}"></div></div>
          <span class="bar-val">${b.val}</span>
        </div>
      `).join('');
    }

    // ── Render Activity ───────────────────────────────────────────────────────
    function renderActivity() {
      const activity = TF.getActivity().slice(0, 10);
      const el = document.getElementById('activityFeed');
      if (!activity.length) {
        el.innerHTML = `<div class="empty-state" style="padding:24px"><p>Sin actividad reciente</p></div>`;
        return;
      }
      el.innerHTML = activity.map(a => `
        <div class="activity-item">
          <span class="activity-dot ${a.type}"></span>
          <div>
            <div class="activity-msg">${a.message}</div>
            <div class="activity-time">${TF.timeAgo(a.timestamp)}</div>
          </div>
        </div>
      `).join('');
    }

    // ── Toggle Task ───────────────────────────────────────────────────────────
    function toggleTask(e, id) {
      e.stopPropagation();
      const task = TF.getTask(id);
      if (!task) return;
      TF.updateTask(id, { status: task.status === 'done' ? 'pending' : 'done' });
      renderAll();
    }

    // ── Export / Import ───────────────────────────────────────────────────────
    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([TF.exportData()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `taskflow-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      showToast('Datos exportados', 'success');
    });

    document.getElementById('importInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          TF.importData(ev.target.result);
          renderAll();
          showToast('Datos importados correctamente', 'success');
        } catch {
          showToast('Error al importar el archivo', 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    document.getElementById('clearBtn').addEventListener('click', async () => {
      const ok = await confirmDialog('Limpiar todos los datos', '¿Estás seguro? Esta acción no se puede deshacer.');
      if (!ok) return;
      TF.clearAll();
      renderAll();
      showToast('Datos eliminados', 'info');
    });

    // ── Render All ────────────────────────────────────────────────────────────
    function renderAll() {
      renderStats();
      renderDonut();
      renderProjects();
      renderTasks();
      renderPriorityBars();
      renderActivity();
    }

    renderAll();
  </script>
</body>
</html>
