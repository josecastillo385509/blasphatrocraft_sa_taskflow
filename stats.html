<!DOCTYPE html>
<html lang="es" data-theme="light" data-page="stats">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadísticas — TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="app" id="app">
  <main class="main">
    <div id="topbar-mount"></div>
    <div class="content">
      <div class="stats-grid">
        <div class="chart-card">
          <div class="section-title">Tareas por <em>estado</em></div>
          <div class="chart-wrap"><canvas id="chart-status"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="section-title">Tareas por <em>prioridad</em></div>
          <div class="chart-wrap"><canvas id="chart-priority"></canvas></div>
        </div>
      </div>
      <div class="card">
        <div class="section-title">Avance por <em>proyecto</em></div>
        <div class="proj-progress-list" id="proj-progress-list"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/stats.js"></script>
</body>
</html>
