<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Aplica el tema guardado ANTES de pintar para evitar flash
    (function () {
      try {
        var t = localStorage.getItem('taskflow_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <title>Kanban · TaskFlow</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/kanban.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar-slot"></aside>

    <main class="main">
      <div class="page-header">
        <div class="page-title-block">
          <div class="eyebrow">— Tablero visual</div>
          <h1 class="page-title"><em>Kanban</em></h1>
          <p class="page-subtitle">Arrastra y suelta para mover tareas entre columnas. El estado se actualiza automáticamente.</p>
        </div>
        <div class="kanban-controls">
          <select class="select" id="kanban-project-filter">
            <option value="">Todos los proyectos</option>
          </select>
        </div>
      </div>

      <div class="kanban-board" id="kanban-board"></div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/kanban.js"></script>
</body>
</html>
