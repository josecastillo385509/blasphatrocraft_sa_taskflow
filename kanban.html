<!DOCTYPE html>
<html lang="es" data-theme="light" data-page="kanban">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero — TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app" id="app">
  <main class="main">
    <div id="topbar-mount"></div>
    <div class="content">
      <div class="toolbar">
        <select class="field-select" id="kanban-project-filter">
          <option value="all">Todos los proyectos</option>
        </select>
        <select class="field-select" id="kanban-priority-filter">
          <option value="all">Todas las prioridades</option>
          <option value="alta">Alta</option>
          <option value="media">Media</option>
          <option value="baja">Baja</option>
        </select>
        <input type="text" class="field-input" id="kanban-search" placeholder="Buscar tarea..." style="flex:1; min-width:180px;">
        <a class="btn btn-ghost" href="tasks.html?new=1">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
          Nueva tarea
        </a>
      </div>
      <div id="kanban-container"></div>
    </div>
  </main>
</div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/kanban.js"></script>
</body>
</html>
