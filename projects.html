<!DOCTYPE html>
<html lang="es" data-theme="light" data-page="projects">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos — TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app" id="app">
  <main class="main">
    <div id="topbar-mount"></div>
    <div class="content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; gap:12px; flex-wrap:wrap;">
        <p style="color:var(--text-muted); font-size:14px; max-width:520px;">
          Organiza tu trabajo en proyectos. Cada proyecto agrupa tareas y muestra su progreso.
        </p>
        <button class="btn btn-accent" id="btn-new-project">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
          Nuevo proyecto
        </button>
      </div>
      <div id="projects-container"></div>
    </div>
  </main>
</div>

<!-- Modal Proyecto -->
<div class="modal-overlay" id="modal-project">
  <div class="modal">
    <div class="modal-head">
      <h3 class="modal-title" id="modal-project-title">Nuevo <em>proyecto</em></h3>
      <button class="icon-btn-sm" data-close-modal>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field" data-field="project-name">
        <label class="field-label">Nombre <span class="req">*</span></label>
        <input class="field-input" id="project-name" maxlength="80" placeholder="Ej: Lanzamiento del sitio web">
        <div class="field-error">El nombre es obligatorio.</div>
      </div>
      <div class="field">
        <label class="field-label">Descripción</label>
        <textarea class="field-textarea" id="project-desc" maxlength="240" placeholder="¿De qué trata este proyecto?"></textarea>
      </div>
      <div class="field">
        <label class="field-label">Color</label>
        <div class="color-picker" id="project-color">
          <div class="color-swatch active" data-color="#C8553D" style="background:#C8553D"></div>
          <div class="color-swatch" data-color="#4A7BA8" style="background:#4A7BA8"></div>
          <div class="color-swatch" data-color="#5C8D5A" style="background:#5C8D5A"></div>
          <div class="color-swatch" data-color="#D4A24A" style="background:#D4A24A"></div>
          <div class="color-swatch" data-color="#8B6FB7" style="background:#8B6FB7"></div>
          <div class="color-swatch" data-color="#3D8B8B" style="background:#3D8B8B"></div>
          <div class="color-swatch" data-color="#B85A8B" style="background:#B85A8B"></div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close-modal>Cancelar</button>
      <button class="btn btn-accent" id="project-save">Guardar</button>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/projects.js"></script>
</body>
</html>
